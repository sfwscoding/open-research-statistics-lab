name: Research statistics checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcq-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MCQ reference tests
        run: |
          node tests/mcq.test.js
          node tests/outcomes.test.js
          node tests/competency.test.js
          node tests/kpa.test.js
          node tests/evidence.test.js
          node tests/integration.test.js
          node tests/ui.test.js
          node tests/lab04.test.js
          node tests/research-reporting.test.js
          node tests/rubric-reliability.test.js
          node tests/lab03.test.js
          node tests/lab03-routing.test.js
          node tests/stat-extensions.test.js
          node --check stat-extensions.js
          node tests/one-sample.test.js
          node --check outcomes.js
          node --check competency.js
          node --check kpa.js
          node --check evidence.js
          node --check research-reporting.js
          node --check rubric-reliability.js
          node --check lab02-app.js
          node --check chapter4-builder.js
          node --check project-tracking.js
      - name: Check JavaScript syntax in HTML
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          for(const page of ['index.html','lab01.html','lab02.html','lab03.html','lab04.html','lab05.html']){
            const html=fs.readFileSync(page,'utf8');
            const inline=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            inline.forEach((match,i)=>new vm.Script(match[1],{filename:page+'-inline-'+i}));
            if(page==='lab02.html'&&!html.includes('lab02-app.js'))throw Error('Lab 02 app is missing');
            console.log(page+': '+inline.length+' inline scripts parsed');
          }
          NODE
