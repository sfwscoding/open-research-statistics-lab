name: Research statistics checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcq-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MCQ reference tests
        run: |
          node tests/mcq.test.js
          node tests/outcomes.test.js
          node tests/competency.test.js
          node tests/kpa.test.js
          node tests/evidence.test.js
          node tests/integration.test.js
          node tests/ui.test.js
          node tests/lab04.test.js
          node tests/lab03.test.js
          node tests/stat-extensions.test.js
          node --check stat-extensions.js
          node tests/one-sample.test.js
          node --check outcomes.js
          node --check competency.js
          node --check kpa.js
          node --check evidence.js
      - name: Check JavaScript syntax in HTML
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw Error('No inline scripts found');
          scripts.forEach((match, i) => new vm.Script(match[1], {filename: 'inline-' + i + '.js'}));
          console.log('Inline JavaScript syntax OK');
          NODE
