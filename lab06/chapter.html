<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 06 · อ่าน EDR รายบท</title>
<link rel="stylesheet" href="../shared-nav.css"><link rel="stylesheet" href="../kpa-window-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{font-family:Prompt,"Noto Sans Thai",system-ui;color:#0f1b3d;background:#eaf1ff;margin:0;padding:18px}main{max-width:1200px;margin:24px auto}.panel{background:white;border:2px solid #14244c;border-radius:15px;padding:24px;margin:14px 0}.bar{height:8px;background:linear-gradient(to right,#1e4fd6 0 34%,#16a34a 34% 67%,#f58220 67%)}h1{font-size:clamp(26px,4vw,40px);margin:17px 0 4px}p{line-height:1.85}h2{font-size:23px}.muted{color:#5e6b7f;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls button,.btn{display:inline-block;padding:10px 17px;border:1px solid #1e4fd6;border-radius:10px;background:white;color:#1e4fd6;font:600 13px Prompt;text-decoration:none;cursor:pointer}button.active,.btn.primary{background:#1e4fd6;color:white}.piece{border-top:1px solid #d6e1ef;padding:15px 0}.piece.section{font-weight:700}.parallel{display:grid;grid-template-columns:1fr 1fr;gap:16px}.en,.th{padding:13px 15px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}.en{background:#f1f5ff}.th{background:#fff}.label{font-size:11px;color:#65718a;font-weight:700}.mode-a .parallel{grid-template-columns:1fr}.mode-a .en{display:none}.status{border-left:4px solid #16a34a;background:#f0fff6;padding:14px}.summary{border-top:3px solid #16a34a}.summary li{padding:6px 0;line-height:1.8}a{color:#1e4fd6}@media(max-width:770px){.parallel{grid-template-columns:1fr}}@media print{@page{size:A4;margin:14mm}body{background:white;padding:0;font-size:10pt}main{max-width:100%;margin:0}.panel{border:none;padding:0;break-inside:auto}.controls,.noprint,.unified-nav{display:none!important}.parallel{gap:10px}.en,.th{padding:6px}.piece{break-inside:avoid}.summary{break-before:page}h1{font-size:20pt}}</style></head><body class="mode-a"><main>
<section class="panel"><div class="bar"></div><p class="muted">EDR TRANSLATION LIBRARY · LAB 06</p><h1 id="title">กำลังเปิดบท...</h1><p id="meta" class="muted"></p><p class="status">ต้นฉบับแปลรอบแรก · มีสรุปบทแยกจากคำแปล และใช้ข้อความชุดเดียวกันสำหรับฉบับ A และ B</p>
<div class="controls noprint"><button id="a" class="active" onclick="setMode('a')">A · ภาษาไทยล้วน</button><button id="b" onclick="setMode('b')">B · อังกฤษ–ไทยเทียบเคียง</button><button onclick="window.print()">พิมพ์ / บันทึกเป็น PDF</button><a class="btn" href="../lab06.html">กลับ Lab 06</a></div>
<p class="muted noprint">PDF ต้นฉบับ: <a id="source" href="https://www.slo.nl/publish/pages/8837/educational-design-research-b-total.pdf" target="_blank" rel="noopener">SLO – Educational Design Research Part B</a></p></section>
<section class="panel" id="content"></section>
<section class="panel summary"><h2>สรุปท้ายบทเพื่อทำความเข้าใจ</h2><p class="muted">ส่วนนี้เป็นคำอธิบายสำหรับการศึกษา ไม่ใช่ข้อความแปลจากหนังสือ</p><ul id="summary"></ul></section></main>
<script>
const params=new URLSearchParams(location.search),id=params.get('id')||'preface';
function el(tag,cls,text){let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function setMode(m){document.body.classList.toggle('mode-a',m!=='b');document.getElementById('a').classList.toggle('active',m!=='b');document.getElementById('b').classList.toggle('active',m==='b');const u=new URL(location.href);u.searchParams.set('view',m);history.replaceState(null,'',u)}
async function render(){if(!/^[a-z0-9-]+$/.test(id)){document.getElementById('title').textContent='รหัสบทไม่ถูกต้อง';return}
try{const r=await fetch('chapters/'+id+'.json',{cache:'no-store'});if(!r.ok)throw Error('ยังไม่พบบทแปลนี้');const doc=await r.json();document.title='Lab 06 · '+doc.title_th;document.getElementById('title').textContent=doc.title_th+' / '+doc.title_en;
document.getElementById('meta').textContent='PDF หน้า '+doc.pdf_pages[0]+'–'+doc.pdf_pages[doc.pdf_pages.length-1]+' · หนังสือหน้า '+doc.printed_pages.join(', ')+' · '+doc.blocks.length+' ช่วงข้อความ';
document.getElementById('source').href='https://www.slo.nl/publish/pages/8837/educational-design-research-b-total.pdf#page='+doc.pdf_pages[0];
const c=document.getElementById('content');c.replaceChildren();
doc.blocks.forEach((b,i)=>{let sec=el('article','piece'+(b.k==='heading'?' section':''));sec.appendChild(el('div','muted','PDF หน้า '+b.p+' · '+(i+1)+'/'+doc.blocks.length));let pair=el('div','parallel'),en=el('div','en'),th=el('div','th');en.append(el('div','label','ENGLISH ORIGINAL'),el('div','',b.en));th.append(el('div','label','คำแปลภาษาไทย'),el('div','',b.th));pair.append(en,th);sec.append(pair);c.append(sec)});
const sum=document.getElementById('summary');sum.replaceChildren();(doc.summary?.points||[]).forEach(t=>sum.append(el('li','',t)));
}catch(e){document.getElementById('title').textContent='ยังไม่สามารถเปิดบทนี้ได้';document.getElementById('content').textContent=String(e.message||e)}}
setMode(params.get('view')==='b'?'b':'a');render();
</script><script src="../shared-nav.js"></script><script>document.querySelectorAll('.unified-nav a[href]').forEach(a=>{const u=a.getAttribute('href');if(u&&!u.startsWith('../')&&!u.startsWith('/')&&!u.includes('://')&&!u.startsWith('#'))a.setAttribute('href','../'+u)});</script><script src="../kpa-window-theme.js"></script></body></html>
